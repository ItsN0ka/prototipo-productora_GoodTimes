<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nueva cotización | GoodTimes</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="cotizacion.css">
</head>
<body>

  <!-- ========== ENCABEZADO ========== -->
  <header class="encabezado">
    <div class="encabezado-contenido">

      <div class="encabezado-usuario">
        <span>Sesión de cliente</span>
        <a href="login.html" class="boton-secundario">Cerrar sesión</a>
      </div>
    </div>
  </header>



  <main class="contenido">

    <!-- Texto de la izquierda -->
    <section class="presentacion">
      <a href="mis-eventos.html" class="enlace-volver">← Volver a mis eventos</a>

      <p class="etiqueta">Nueva cotización</p>
      <h1 class="titulo">Cuéntanos sobre tu evento</h1>
      <p class="descripcion">
        Completa el formulario y nuestro equipo te enviará una propuesta hecha a tu medida.
      </p>

    </section>


    <!-- Formulario de la derecha -->
    <div class="zona-formulario">
    <section class="tarjeta">
      <h2 class="tarjeta-titulo">Datos del evento</h2>
      <p class="tarjeta-subtitulo">Paso 1 de 1 · Información general</p>

      <form class="formulario" id="formulario-cotizacion">

        <!-- Fila 1 -->
        <div class="fila">
          <div class="campo">
            <label for="nombre">Nombre completo</label>
            <input type="text" id="nombre" value="Cliente Pulso" required>
          </div>

          <div class="campo">
            <label for="correo">Correo electrónico</label>
            <input type="email" id="correo" value="cliente@correo.com" required>
          </div>
        </div>

        <!-- Fila 2 -->
        <div class="fila">
          <div class="campo">
            <label for="telefono">Teléfono</label>
            <input type="tel" id="telefono" placeholder="+52 55 0000 0000">
          </div>

          <div class="campo">
            <label for="tipo-evento">Tipo de evento</label>
            <select id="tipo-evento" required>
              <option value="">Selecciona una opción</option>
              <option>Concierto</option>
              <option>Festival</option>
              <option>Evento corporativo</option>
              <option>Boda</option>
              <option>Cumpleaños</option>
              <option>Otro</option>
            </select>
          </div>
        </div>

        <!-- Fila 3 -->
        <div class="fila">
          <div class="campo">
            <label for="nombre-evento">Nombre del evento</label>
            <input type="text" id="nombre-evento" placeholder="Ej. Aniversario Lumen">
          </div>

          <div class="campo">
            <label for="asistentes">Número de asistentes</label>
            <input type="number" id="asistentes" placeholder="Ej. 150" min="1">
          </div>
        </div>

        <!-- Campos de ancho completo -->
        <div class="campo">
          <label for="lugar">Lugar o zona</label>
          <input type="text" id="lugar" placeholder="Ciudad o recinto">
        </div>

        <div class="campo">
          <label for="fecha">Fecha deseada</label>
          <input type="date" id="fecha" required>
        </div>

        <!-- Horarios -->
        <div class="campo">
          <label>Elige un horario disponible</label>
          <div class="horarios">
            <label class="horario">
              <input type="radio" name="horario" value="10:00">
              <span>10:00</span>
            </label>
            <label class="horario">
              <input type="radio" name="horario" value="12:00">
              <span>12:00</span>
            </label>
            <!-- "disabled" = horario ocupado -->
            <label class="horario">
              <input type="radio" name="horario" value="16:00" disabled>
              <span>16:00</span>
            </label>
            <label class="horario">
              <input type="radio" name="horario" value="18:00">
              <span>18:00</span>
            </label>
            <label class="horario">
              <input type="radio" name="horario" value="20:00" disabled>
              <span>20:00</span>
            </label>
          </div>
          <p class="aviso">Los horarios tachados ya están ocupados.</p>
        </div>

        <div class="campo">
          <label for="idea">Cuéntanos sobre tu idea</label>
          <textarea id="idea" rows="4" placeholder="Concepto, necesidades técnicas, ambiente que imaginas..."></textarea>
        </div>

        <button type="submit" class="boton-principal">Solicitar cotización</button>
      </form>
    </section>
    </div>

  </main>

</body>
</html>
