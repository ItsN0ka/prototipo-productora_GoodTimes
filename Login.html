<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - GoodTimes</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
    <body>
        <header class="header">
            <div class="wrap bar">
                <a class="brand" href="index.html"><span class="dot">✦</span>GOODTIMES</a>
                <a class="btn" href="index.html">Volver al Inicio</a>
            </div>
        </header>
        <main class="narrow">
            <div class="panel">
                <p class="eyebrow-logout">Tu espacio GoodTimesa</p>
                <h1 class="page-title">Bienvenido de nuevo</h1>
                <p class="sub">Ingresa con el correo y la contraseña de tu cuenta.</p>
                <form id="login-form">
                    <label class="field">Correo electronico<input id="email" name="email" type="email" autocomplete="username" placeholder="tu@correo.com" maxlength="254" required></label>
                    <label class="field">Contraseña<input id="password" name="password" type="password" autocomplete="current-password" placeholder="Tu contraseña" maxlength="1024" required ></label>
                    <button class="btn-dark full" type="submit" disabled>Acceso destactivado para el prototipo</button>
                </form>
                <p class="hint" style="margin-top: 18px"></p>
                <div class="actions" style="margin-top: 16px;">
                    <a class="btn-light" href="cliente.html">Panel Cliente</a>
                    <a class="btn" href="admin.html">Panel Administrador</a>
                </div>
            </div>
        </main>
    </body>
</html>
